server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        # 1. Auth Service Routes
        - id: auth-service-routes
          uri: http://${AUTH_SERVICE_HOST:localhost}:${AUTH_SERVICE_PORT:8081}
          predicates:
            - Path=/api/v1/auth/**, /api/v1/me/**

        # 2. Catalog Service Routes
        - id: catalog-service-routes
          uri: http://${CATALOG_SERVICE_HOST:localhost}:${CATALOG_SERVICE_PORT:8082}
          predicates:
            - Path=/api/v1/venues/**, /api/v1/sports/**, /api/v1/owner/**

        # 3. Booking Service Routes
        - id: booking-service-routes
          uri: http://${BOOKING_SERVICE_HOST:localhost}:${BOOKING_SERVICE_PORT:8083}
          predicates:
            - Path=/api/v1/resources/**, /api/v1/bookings/**, /api/v1/staff/**

        # 4. Payment Service Routes
        - id: payment-service-routes
          uri: http://${PAYMENT_SERVICE_HOST:localhost}:${PAYMENT_SERVICE_PORT:8084}
          predicates:
            - Path=/api/v1/payments/**, /api/v1/webhooks/**

      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
