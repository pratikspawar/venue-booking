apiVersion: batch/v1
kind: Job
metadata:
  name: flyway-schema-migration
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-1"
    helm.sh/hook-delete-policy: hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        job: flyway-schema-migration
    spec:
      restartPolicy: OnFailure
      containers:
        - name: flyway
          image: flyway/flyway:10-alpine
          args:
            - -url=jdbc:mysql://$(DB_HOST):3306/$(DB_NAME)?useSSL=false&allowPublicKeyRetrieval=true
            - -user=$(DB_USER)
            - -password=$(DB_PASSWORD)
            - -locations=filesystem:/flyway/sql
            - -baselineOnMigrate=true
            - -baselineVersion=1
            - migrate
          envFrom:
            - configMapRef:
                name: venue-config
            - secretRef:
                name: venue-secrets
          volumeMounts:
            - name: migration-sql
              mountPath: /flyway/sql
              readOnly: true
      volumes:
        - name: migration-sql
          configMap:
            name: flyway-migrations
