apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: venue-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: 10m
spec:
  tls:
    - hosts:
        - api.venueplatform.com
        - admin.venueplatform.com
      secretName: venue-tls-certs
  rules:
    - host: api.venueplatform.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: venue-api-svc
                port:
                  number: 8080
    - host: admin.venueplatform.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: venue-admin-web-svc
                port:
                  number: 80
