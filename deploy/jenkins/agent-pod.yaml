apiVersion: v1
kind: Pod
metadata:
  labels:
    jenkins: agent
spec:
  containers:
    - name: maven
      image: maven:3.9.9-eclipse-temurin-21
      command: ['cat']
      tty: true
      resources:
        requests:
          cpu: 500m
          memory: 1Gi
    - name: node
      image: node:20-alpine
      command: ['cat']
      tty: true
    - name: kaniko
      image: gcr.io/kaniko-project/executor:debug
      command: ['cat']
      tty: true
    - name: trivy
      image: aquasec/trivy:latest
      command: ['cat']
      tty: true
    - name: kubectl
      image: bitnami/kubectl:latest
      command: ['cat']
      tty: true
